services:
  postiz:
    image: ${POSTIZ_IMAGE}
    container_name: postiz
    restart: unless-stopped
    labels:
      # Watched by the `autoheal` sidecar below — NOT the same as Docker's own
      # `restart: unless-stopped`, which only fires on the container's PID 1
      # exiting. The known failure mode here is PID 1 (pm2-runtime) staying up
      # fine while its "backend" app loses the boot-time race for :3000
      # (stale listener from the previous process still holding it -> pm2
      # respawns -> EADDRINUSE -> silent crash -> nothing bound) — frontend
      # answers, /api/* 502s forever, and the container itself never exits so
      # `restart: unless-stopped` never triggers. Recurs on every reboot/
      # `docker compose up` that recreates this container. Confirmed 2026-09-06
      # and 2026-09-15 (`pm2 restart backend` inside the container was the fix
      # both times) — this automates that fix instead of a manual re-check.
      autoheal: "true"
    ports:
      - "${POSTIZ_PORT}:5000"
    healthcheck:
      # Through nginx :5000 -> backend :3000, the exact request path that
      # 502s when the backend lost the port race above. node -e, not curl/
      # wget/nc — none of those are in this image, only node.
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:5000/api/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s   # normal boot is ~10-15s; reboot contention (Postgres/Temporal also starting) needs more room before the first real check counts
    environment:
      MAIN_URL: ${MAIN_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY}
      NEXT_PUBLIC_UPLOAD_DIRECTORY: ${NEXT_PUBLIC_UPLOAD_DIRECTORY}
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
      IS_GENERAL: ${IS_GENERAL}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_LIMIT: ${API_LIMIT}
      NX_ADD_PLUGINS: ${NX_ADD_PLUGINS}
      FEE_AMOUNT: ${FEE_AMOUNT}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    networks:
      - postiz-network
      - temporal-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      postiz:
        condition: service_started
    networks:
      - postiz-network

  autoheal:
    # Watches containers labeled autoheal=true (just `postiz` for now) and
    # `docker restart`s them when Docker marks them unhealthy — the missing
    # link between a HEALTHCHECK and an actual recovery action; Docker itself
    # never restarts on a failed healthcheck, only on the container's PID 1
    # exiting (see the label comment on the postiz service for why that
    # never fires here). Needs the docker socket to issue the restart — the
    # standard trade-off for this pattern, scoped to this one host.
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 20
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postiz-network

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    expose:
      - "9200"
    networks:
      - temporal-network

  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}
    expose:
      - "5432"
    networks:
      - temporal-network

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health 2>&1 | grep -q SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - temporal-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    container_name: temporal-admin-tools
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - temporal-network

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      - temporal
    networks:
      - temporal-network

  # Daily auto-poster. Opt-in: only starts with `--profile scheduler`
  # (via `make scheduler-up`). Runs bin/daily.py on a cron; talks to the other
  # containers through the docker socket, so daily.py / heal.sh run unchanged.
  scheduler:
    build:
      context: .
      dockerfile: ops/scheduler/Dockerfile
    container_name: postiz-scheduler
    profiles: ["scheduler"]
    restart: unless-stopped
    # tini as PID 1: supercronic's own reaper fails to fork-exec when it is PID 1
    # (seen on WSL2), and tini reaps the make/docker children the cron jobs spawn.
    init: true
    working_dir: /app
    environment:
      TZ: ${SCHEDULER_TZ:-Etc/GMT+5}
      # Reuse the host's Firestore service-account env var as-is. The key file is
      # identity-mounted below at the exact same path, so this path is valid
      # inside the container too. Empty -> falls back to the mounted user ADC.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # HANDLE_ENDPOINT_URL is deliberately NOT set here. bin/daily.py runs
      # load_dotenv() and src/lib/config_loader.py fills os.environ from the
      # mounted /app/.env with setdefault() — so a value set here would win and
      # pin it. Leaving it unset makes .env the single source (now the private
      # Cloud Run resolver; handles.py mints an OIDC token via
      # GOOGLE_APPLICATION_CREDENTIALS, which is set + mounted below).
      # Daily volume knobs — how many cards the cron publishes per run, how far
      # apart, and which tier. Set in .env (or here) instead of editing
      # ops/scheduler/run-daily.sh. X bills ~$0.20/post, so COUNT is a cost dial.
      # Unset -> run-daily.sh defaults (1 card, 90s, arboryx.robotics).
      DAILY_POST_COUNT: ${DAILY_POST_COUNT:-}
      DAILY_POST_DELAY: ${DAILY_POST_DELAY:-}
      DAILY_POST_TIER: ${DAILY_POST_TIER:-arboryx.robotics}
    volumes:
      - .:/app                                        # repo + .env + data/ (logs, posted-log)
      - /var/run/docker.sock:/var/run/docker.sock     # so daily.py/heal.sh can exec siblings
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro # user ADC fallback for Firestore
      # Identity-mount the SA key at its host path (works for any key location).
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:ro
      - ../catalyst-knowledge-graph:/catalyst-knowledge-graph:ro  # robotics branch cards.json source
    depends_on:
      postiz:
        condition: service_started

  # GCP-mode trigger sidecar. Opt-in: only starts with `--profile scheduler-gcp`
  # (via `make scheduler-up` when GCP_PROD_SCHEDULER=enabled). Reuses the
  # scheduler image but runs the HTTP trigger instead of supercronic — GCP Cloud
  # Scheduler POSTs here (through the CF tunnel) and this execs run-daily.sh.
  # No local cron: the schedule lives in GCP, the work runs here.
  scheduler-trigger:
    build:
      context: .
      dockerfile: ops/scheduler/Dockerfile
    container_name: postiz-scheduler-trigger
    profiles: ["scheduler-gcp"]
    restart: unless-stopped
    # tini as PID 1 — reaps the make/docker children run-daily.sh spawns.
    init: true
    working_dir: /app
    # Boot = catch up on fires missed while the host slept, then serve triggers.
    command: ["bash", "-c", "(/app/ops/scheduler/catch-up.sh gcp >> /app/data/daily.log 2>&1 &); exec python3 /app/ops/scheduler/trigger.py"]
    environment:
      TZ: ${SCHEDULER_TZ:-Etc/GMT+5}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # HANDLE_ENDPOINT_URL: not set here — read from the mounted /app/.env by
      # load_dotenv() (same reasoning as the scheduler service above).
      DAILY_POST_COUNT: ${DAILY_POST_COUNT:-}
      DAILY_POST_DELAY: ${DAILY_POST_DELAY:-}
      DAILY_POST_TIER: ${DAILY_POST_TIER:-arboryx.robotics}
      # Shared secret the trigger checks on every /run; set in .env. The port is
      # internal to the compose/CF-tunnel network — not published to the host.
      SCHEDULER_TRIGGER_TOKEN: ${SCHEDULER_TRIGGER_TOKEN:-}
      SCHEDULER_TRIGGER_PORT: ${SCHEDULER_TRIGGER_PORT:-8090}
    expose:
      - "${SCHEDULER_TRIGGER_PORT:-8090}"
    networks:
      - postiz-network      # reachable by cloudflared for the tunnel ingress rule
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:ro
      - ../catalyst-knowledge-graph:/catalyst-knowledge-graph:ro
    depends_on:
      postiz:
        condition: service_started

volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false

networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
